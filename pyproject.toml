[project]
name = "kagura"
version = "0.1.0"
description = "Quantitative research on the Japanese yen, USD/JPY, and Japanese monetary policy."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aki Blasco" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "certifi>=2024",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
